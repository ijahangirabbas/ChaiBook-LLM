name: ChaiBook LLM Production CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-backend:
    name: Verify Backend API & Repositories
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chaibook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chaibook_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      OPENAI_API_KEY: sk-proj-test-placeholder-key-for-ci
      CLERK_SECRET_KEY: sk_test_placeholder_key_for_ci
      DATABASE_URL: '******localhost:5432/chaibook_test'
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend

      - name: Apply Prisma Migrations
        run: npx prisma migrate deploy
        working-directory: backend

      - name: TypeScript Build Check
        run: npm run build
        working-directory: backend

      - name: Run Automated API & Security Tests
        run: npm run test:api
        working-directory: backend

  verify-frontend:
    name: Verify Frontend Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Frontend Application
        run: npm run build
        working-directory: frontend

      - name: Lint Frontend
        run: npm run lint
        working-directory: frontend