version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. ChaiBook LLM Node.js / TypeScript RAG Backend Server
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chaibook_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - PROCESS_ROLE=api
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-chaibook_sources}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - chaibook_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chaibook_worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      - PORT=3001
      - NODE_ENV=production
      - PROCESS_ROLE=worker
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JINA_API_KEY=${JINA_API_KEY:-}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-chaibook_sources}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-chaibook-sources}
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chaibook_network

  # ---------------------------------------------------------------------------
  # 2. Qdrant Vector Database Server
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: chaibook_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage:z
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - chaibook_network

  # ---------------------------------------------------------------------------
  # 3. Valkey (Redis-compatible) — Cache & BullMQ Background Task Queue
  # ---------------------------------------------------------------------------
  redis:
    image: valkey/valkey:8-alpine
    container_name: chaibook_valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - chaibook_network

# -----------------------------------------------------------------------------
# Persistent Data Volumes & Networks
# -----------------------------------------------------------------------------
volumes:
  qdrant_storage:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  chaibook_network:
    driver: bridge
