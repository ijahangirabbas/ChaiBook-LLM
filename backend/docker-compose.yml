version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. ChaiBook LLM Node.js / TypeScript RAG Backend Server
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chaibook_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-chaibook_sources}
      - REDIS_URL=redis://redis:6379
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chaibook_network

  # ---------------------------------------------------------------------------
  # 2. Qdrant Vector Database Server
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: chaibook_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage:z
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - chaibook_network

  # ---------------------------------------------------------------------------
  # 3. Redis Cache & BullMQ Background Task Queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: chaibook_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - chaibook_network

# -----------------------------------------------------------------------------
# Persistent Data Volumes & Networks
# -----------------------------------------------------------------------------
volumes:
  qdrant_storage:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  chaibook_network:
    driver: bridge
